# After every deploy, the read-only browser tests run against the deployed site (link crawl,
# headers, CSP, search, accessibility…; tests that write data are left out, see e2e/tags.ts).
# Cloudflare's Workers Builds reports each deploy to GitHub as a check run named
# "Workers Builds: mikraot"; a successful one on main starts this workflow. A failed run is
# emailed by GitHub to the repository owner. It can also be run by hand for any address.
name: Deployed site

on:
  check_run:
    types: [completed]
  workflow_dispatch:
    inputs:
      url:
        description: Address of the deployed site
        required: true
        default: https://mikraot.net

permissions:
  contents: read
  # To see whether a newer commit on main was deployed (its Workers Builds check).
  checks: read

env:
  # The production address; becomes https://mikraot.net at the cutover (docs/CUTOVER.md, step 2).
  DEPLOYED_URL: ${{ inputs.url || 'https://mikraot.net' }}

jobs:
  test:
    # Only Cloudflare's own app reports deploys (any app could name a check run the same).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.check_run.app.slug == 'cloudflare-workers-and-pages' &&
      github.event.check_run.name == 'Workers Builds: mikraot' &&
      github.event.check_run.conclusion == 'success')
    runs-on: ubuntu-latest
    # A hang (e.g. a stalled package download) fails here instead of after GitHub's 6 hours.
    timeout-minutes: 30
    # One run per deployed commit. Branch previews (e.g. Renovate's) post the same check for other
    # commits; a shared group let those cancel the production run (seen 2026-10-07).
    concurrency:
      group: deployed-site-${{ github.event_name }}-${{ github.event.check_run.head_sha || github.sha }}
      cancel-in-progress: true
    env:
      SHA: ${{ github.event.check_run.head_sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit that was deployed (the accessibility tests list pages from its build).
          ref: ${{ env.SHA }}
          fetch-depth: 0
          persist-credentials: false
      # Branch previews are reported under the same name; only production deploys (commits on
      # main) are tested, and nothing from another branch or a fork runs here. A commit that a
      # newer one on main has replaced on the site is not tested either: its tests would run
      # against the newer site and fail for nothing (seen 2026-10-22, two merges a minute apart).
      # Only a newer commit whose deploy succeeded counts; if its build failed, the site still runs
      # this one, which is then tested as usual.
      - name: Deployed from main, and still what the site runs?
        id: main
        run: |
          cat > "$RUNNER_TEMP/superseded.sh" <<'SH'
          # Exit 0 if main's latest commit is newer than $SHA and Cloudflare deployed it.
          git fetch --quiet origin main
          latest=$(git rev-parse origin/main)
          [ "$latest" != "$SHA" ] || exit 1
          deployed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$latest/check-runs" --jq '
            [.check_runs[] | select(.app.slug == "cloudflare-workers-and-pages"
              and .name == "Workers Builds: mikraot" and .conclusion == "success")] | length')
          [ "$deployed" -gt 0 ]
          SH
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "$SHA is not on main (a branch preview): nothing to test."
          elif bash "$RUNNER_TEMP/superseded.sh"; then
            echo "::notice::A newer commit on main is deployed; its run tests the site."
          else
            echo "deployed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.main.outputs.deployed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - if: steps.main.outputs.deployed == 'true'
        run: npm ci
      - if: steps.main.outputs.deployed == 'true'
        run: npx playwright install --with-deps chromium
        timeout-minutes: 10 # normally under 4
      - if: steps.main.outputs.deployed == 'true'
        run: npm run build:site
      # A newer deploy can also land while the tests run; a failure then counts only if this commit
      # is still the latest.
      - if: steps.main.outputs.deployed == 'true'
        run: |
          npm run test:deployed -- "$DEPLOYED_URL" && exit 0
          if bash "$RUNNER_TEMP/superseded.sh"; then
            echo "::notice::Failed, but a newer commit was deployed meanwhile: its run tests the site."
            exit 0
          fi
          exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
