# Checks every push and pull request. Nothing here deploys or needs secrets.
name: CI

on:
  # Pull requests are tested before merging; main again after each merge. (Pushes to PR
  # branches would run everything twice: once as a push, once as the pull request.)
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    # A hang (e.g. a stalled package download) fails here instead of after GitHub's 6 hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history, not just the last commit
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --verbose

  check:
    name: Types, lint, format, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      # The editor's Hebrew labels (patches/): a Keystatic update that breaks the patch fails
      # here, in its Renovate PR, rather than silently in the editor.
      - run: npm run patches

  e2e:
    name: Build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 10 # normally under 4
      # The Worker's local .dev.vars, with Cloudflare's public always-pass Turnstile test key.
      - run: echo 'TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA' > .dev.vars
      # Builds the site, resets the local D1 to the fixture data, and serves it in workerd.
      - run: npm run test:e2e
      # Speed, accessibility, best-practice and SEO scores of the build the tests just made
      # (lighthouserc.cjs).
      - run: npm run lighthouse
      - name: Deploy dry run (bundles the Worker, uploads nothing)
        run: npm run deploy:dry
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-traces
          path: |
            test-results/
            .lighthouseci/
          retention-days: 7
