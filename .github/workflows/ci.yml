# Checks every pull request, and main after each merge. Nothing here deploys or needs secrets.
name: CI

on:
  # Pull requests are tested before merging; main again after each merge. (Pushes to PR
  # branches would run everything twice: once as a push, once as the pull request.)
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    # A hang (e.g. a stalled package download) fails here instead of after GitHub's 6 hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history, not just the last commit
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --verbose

  check:
    name: Types, lint, format, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      # The editor's Hebrew labels (patches/): a Keystatic update that breaks the patch fails
      # here, in its Renovate PR, rather than silently in the editor.
      - run: npm run patches

  # The browser tests, split over three jobs (Playwright's --shard: each runs a third of the
  # tests, all of them together); they were the slowest part of a run.
  e2e-shard:
    name: Build and browser tests ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # id-token: Argos accepts the screenshots on GitHub's word (OIDC), with no token to keep.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    # The three jobs' screenshots form one Argos build (the reporter numbers its part from
    # --shard), closed by argos-finalize below: a job whose tests took no screenshots, or failed,
    # would otherwise leave it pending.
    env:
      ARGOS_PARALLEL: 'true'
      ARGOS_PARALLEL_TOTAL: '-1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 10 # normally under 4
      # The Worker's local .dev.vars, with Cloudflare's public always-pass Turnstile test key.
      - run: echo 'TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA' > .dev.vars
      # Builds the site, resets the local D1 to the fixture data, and serves it in workerd.
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}
      - name: Deploy dry run (bundles the Worker, uploads nothing)
        if: matrix.shard == '1/3'
        run: npm run deploy:dry
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7

  # Closes the Argos build of the three jobs above, whatever their outcome. Argos then reports its
  # comparison on the pull request: informational, not required for merging.
  argos-finalize:
    name: Screenshots to Argos
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The CLI alone (the version in package-lock.json), without installing the whole project.
      - run: npx --yes @argos-ci/cli@6.9.6 finalize --skip-if-empty
        env:
          ARGOS_PARALLEL: 'true'

  # The check that merging requires ("Build and browser tests", in the ruleset): passes only if
  # every shard passed. `always()`, because a skipped required check would count as passed.
  e2e:
    name: Build and browser tests
    needs: e2e-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.e2e-shard.result }}" = success

  # Speed, accessibility, best-practice and SEO scores (lighthouserc.cjs). Its own jobs, alongside
  # the browser tests; one page each (same pages, runs and limits), since Lighthouse was the
  # slowest part of a run.
  lighthouse-shard:
    name: Lighthouse ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4', '4/4']
    env:
      LH_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 10 # normally under 4
      - run: echo 'TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA' > .dev.vars
      # The site in workerd as in production, with the local D1 (fixtures) for the comments API.
      - run: npm run db:local:reset
      - run: npm run build:site
      - run: npm run lighthouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: lighthouse-reports-${{ strategy.job-index }}
          path: .lighthouseci/
          retention-days: 7

  # The check that merging requires ("Lighthouse", in the ruleset): passes only if every shard
  # passed. `always()`, because a skipped required check would count as passed.
  lighthouse:
    name: Lighthouse
    needs: lighthouse-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.lighthouse-shard.result }}" = success
