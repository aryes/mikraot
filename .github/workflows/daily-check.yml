# Once a day, from outside the site: last night's database backup exists, and the Worker's
# requests are well below the free plan's daily limit (scripts/daily-check/). The site can't
# report either itself: the backup email covers a failed run, not one that never started. GitHub
# emails a failed scheduled run to whoever last changed the schedule (Arye's account), if their
# Actions notifications are on.
name: Daily check

on:
  schedule:
    - cron: '30 6 * * *' # 06:30 UTC, after the 02:17 backup
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/daily-check/run.ts
        env:
          # A read-only token (KV and analytics), not the configuration token in .env.
          CF_MONITOR_API_TOKEN: ${{ secrets.CF_MONITOR_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
